<!DOCTYPE html>
<html>

<head>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="container">


<h2>🩺 Painel Médico</h2>


<div id="triagens"></div>


<hr>


<h3>Consulta</h3>



<input id="paciente" placeholder="Paciente" readonly>


<input id="diagnostico" placeholder="Diagnóstico">



<select id="medicacao">

<option value="">
Selecione a medicação
</option>

</select>



<textarea id="obs" placeholder="Observações"></textarea>



<button onclick="salvar()">
Salvar Consulta
</button>





<div id="decisao" style="display:none">


<h3>Destino do paciente</h3>


<button onclick="internar()">

🏥 Internar

</button>



<button onclick="liberar()">

✅ Liberar

</button>



</div>





<div id="voltar" style="display:none">


<button onclick="voltarMedico()">

⬅ Voltar

</button>


</div>



</div>






<script>


let triagensCarregadas=[];





function carregar(){


fetch("/triagens")


.then(r=>r.json())


.then(data=>{


triagensCarregadas=[];


const div=document.getElementById("triagens");


div.innerHTML="";




data.forEach((t)=>{



if(
t.status==="liberado" ||
t.status==="internado"
){

return;

}



const index =
triagensCarregadas.length;



triagensCarregadas.push(t);





div.innerHTML += `


<div class="card">


<h3>${t.nome}</h3>


<p>

<b>Sintoma:</b>

${t.sintoma || t.sintomas || "Não informado"}

</p>



<p>

<b>Temperatura:</b>

${t.temperatura || t.temp || "Não informada"} °C

</p>



<p>

<span class="${t.risco}">

${t.risco}

</span>


</p>



<p>

<b>Alergia:</b>

${t.alergia || "Nenhuma"}

</p>



<p>

<b>Observação:</b>

${t.observacao || "Nenhuma"}

</p>



<button onclick="selecionar(${index})">

Atender

</button>


<br><br>


<button onclick="verFicha(${index})">

📄 Ver ficha do paciente

</button>



</div>



`;



});



});


}









function selecionar(index){


const t =
triagensCarregadas[index];



document.getElementById("paciente").value =
t.nome;



document.getElementById("obs").value =
t.observacao || "";




if(
t.alergia &&
t.alergia !== "Nenhuma"
){


alert(
"⚠️ Paciente possui alergia: "
+t.alergia
);


}



}









function verFicha(index){


const t =
triagensCarregadas[index];



fetch("/ficha/" + encodeURIComponent(t.nome))


.then(r=>r.json())


.then(data=>{


let ficha = `


===== 🏥 FICHA DO PACIENTE =====



👤 DADOS DO PACIENTE


Nome:
${data.paciente.nome || "Não informado"}


CPF:
${data.paciente.cpf || "Não informado"}


Tipo:
${data.paciente.tipo || "Não informado"}



==============================


🩺 TRIAGEM



Sintoma:
${data.triagem.sintoma || data.triagem.sintomas || "Não informado"}



Temperatura:

${data.triagem.temperatura || data.triagem.temp || "Não informado"} °C



Risco:

${data.triagem.risco || "Não informado"}



Alergia:

${data.triagem.alergia || "Nenhuma"}



Observação:

${data.triagem.observacao || "Nenhuma"}



==============================


📋 CONSULTAS



`;



if(data.consultas.length === 0){


ficha += "Nenhuma consulta registrada";


}



data.consultas.forEach(c=>{


ficha += `


Diagnóstico:

${c.diagnostico || "Não informado"}



Medicação:

${c.medicacao || "Nenhuma"}



Observação:

${c.obs || "Nenhuma"}



------------------------------


`;



});



alert(ficha);



})


.catch(()=>{


alert("Erro ao carregar ficha");


});


}









function carregarMedicacoes(){



fetch("/lista-medicacoes")


.then(r=>r.json())


.then(data=>{


const select =
document.getElementById("medicacao");



select.innerHTML=`

<option value="">

Selecione a medicação

</option>

`;



data.forEach(med=>{


let option =
document.createElement("option");


option.value=med;


option.textContent=med;


select.appendChild(option);



});



});


}









function salvar(){



const paciente =
document.getElementById("paciente").value;



const diagnostico =
document.getElementById("diagnostico").value;



const medicacao =
document.getElementById("medicacao").value;



const obs =
document.getElementById("obs").value;





if(!paciente){


alert("Selecione um paciente.");


return;


}






fetch("/consulta",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


paciente,

diagnostico,

medicacao,

obs


})



})


.then(r=>r.json())


.then(()=>{



alert("Consulta salva!");



document.getElementById("decisao").style.display="block";



})

.catch(()=>{


alert("Erro ao salvar consulta");


});



}









function internar(){



const paciente =
document.getElementById("paciente").value;




fetch("/internar",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


paciente


})


})



.then(r=>r.json())


.then(()=>{


alert("🏥 Paciente internado");


limparTela();


carregar();


});


}









function liberar(){



const paciente =
document.getElementById("paciente").value;




fetch("/liberar",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


paciente


})


})



.then(r=>r.json())


.then(()=>{


alert("✅ Paciente liberado");


limparTela();


carregar();


});



}









function limparTela(){



document.getElementById("paciente").value="";


document.getElementById("diagnostico").value="";


document.getElementById("medicacao").value="";


document.getElementById("obs").value="";



document.getElementById("decisao").style.display="none";



document.getElementById("voltar").style.display="block";



}









function voltarMedico(){


document.getElementById("voltar").style.display="none";


carregar();


}









carregar();


carregarMedicacoes();



</script>



</body>


</html>
